<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLD Human vs Bot Challenge (Hard Edition)</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #151a23;
            --accent-color: #00f2fe;
            --human-color: #00ff87;
            --bot-color: #ff0055;
            --text-color: #ffffff;
            --sub-text: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 85, 0.1) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header {
            margin-bottom: 20px;
        }

        .logo {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* START SCREEN */
        .desc {
            color: var(--sub-text);
            font-size: 14px;
            line-height: 1.6;
            margin: 20px 0;
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: 12px;
            border-left: 3px solid var(--accent-color);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-color), #4facfe);
            color: #000;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* MEMORIZE SCREEN */
        .timer-badge {
            display: inline-block;
            background: rgba(0, 242, 254, 0.2);
            color: var(--accent-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* GAME SCREEN */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 600;
        }

        .time-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .time-bar-fill {
            height: 100%;
            background: var(--accent-color);
            width: 100%;
            transition: width 0.05s linear;
        }

        .image-box {
            width: 220px;
            height: 220px;
            margin: 0 auto 24px;
            background: #000;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 16px;
        }

        .btn-choice {
            flex: 1;
            padding: 18px 0;
            font-size: 24px;
            font-weight: 900;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: transform 0.1s;
        }

        .btn-choice span {
            font-size: 12px;
            font-weight: 600;
        }

        .btn-human {
            background: rgba(0, 255, 135, 0.15);
            color: var(--human-color);
            border: 2px solid var(--human-color);
        }

        .btn-bot {
            background: rgba(255, 0, 85, 0.15);
            color: var(--bot-color);
            border: 2px solid var(--bot-color);
        }

        .btn-choice:active {
            transform: scale(0.95);
        }

        /* FEEDBACK OVERLAY */
        .feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            font-weight: 900;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }

        .feedback.correct {
            color: var(--human-color);
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }

        .feedback.wrong {
            color: var(--bot-color);
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }

        /* RESULT SCREEN */
        .score-val {
            font-size: 48px;
            font-weight: 900;
            color: var(--accent-color);
            margin: 10px 0;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .badge.human { background: var(--human-color); color: #000; }
        .badge.bot { background: var(--bot-color); color: #fff; }

        .btn-share {
            background: #1d9bf0;
            color: white;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">World ID Verification</div>
        <h1>HUMAN OR BOT?</h1>
    </div>

    <!-- 1. START SCREEN -->
    <div id="screen-start" class="screen active">
        <div class="desc">
            🔍 <b>난이도 상향 패치 적용 (Hard)</b><br><br>
            1. 처음에 3초간 기준 <b>인간 캐릭터</b>가 등장합니다.<br>
            2. 이후 7개의 이미지가 연속으로 등장합니다.<br>
            3. 미세한 칩, 글리치 노이즈, 로봇 눈빛 등 <b>스파이 봇</b>을 정밀 구별하세요.<br>
            4. 라운드당 <b>3초 제한시간</b>! 속도가 빠를수록 고득점!
        </div>
        <button class="btn" onclick="startGuide()">검증 시작하기</button>
    </div>

    <!-- 2. MEMORIZE SCREEN -->
    <div id="screen-memo" class="screen">
        <div class="timer-badge">기준 인간 기억하기 (<span id="memo-timer">3</span>s)</div>
        <div class="image-box" id="base-human-box"></div>
        <p style="color: var(--sub-text); font-size: 13px;">이 얼굴이 순수한 [인간 Base] 기준입니다.</p>
    </div>

    <!-- 3. GAME SCREEN -->
    <div id="screen-game" class="screen">
        <div class="status-bar">
            <span>ROUND <span id="round-num">1</span> / 7</span>
            <span>SCORE: <span id="score-num">0</span></span>
        </div>
        <div class="time-bar-bg">
            <div class="time-bar-fill" id="time-fill"></div>
        </div>

        <div class="image-box">
            <div id="character-target"></div>
            <div id="feedback" class="feedback"></div>
        </div>

        <div class="btn-group">
            <button class="btn-choice btn-human" onclick="makeChoice(true)">
                O
                <span>HUMAN (인간)</span>
            </button>
            <button class="btn-choice btn-bot" onclick="makeChoice(false)">
                X
                <span>BOT (봇)</span>
            </button>
        </div>
    </div>

    <!-- 4. RESULT SCREEN -->
    <div id="screen-result" class="screen">
        <div style="font-size: 14px; color: var(--sub-text);">최종 검증 점수</div>
        <div class="score-val" id="final-score">0</div>
        <div id="result-badge" class="badge human">VERIFIED HUMAN</div>
        
        <p id="result-desc" style="color: var(--sub-text); font-size: 14px; margin-bottom: 24px;"></p>

        <button class="btn" onclick="startGuide()">다시 도전하기</button>
        <button class="btn btn-share" onclick="shareTwitter()">X (트위터)에 인증하기 𝕏</button>
    </div>
</div>

<script>
    // --- AUDIO SYNTHESIZER ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // A5
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // --- CHARACTER SVG GENERATOR ---
    function generateCharacterSVG(isBot, variant = 0) {
        // Base SVG Template
        let eyeLeftColor = "#00f2fe";
        let eyeRightColor = "#00f2fe";
        let skinTone = "#ffe0bd";
        let hairColor = "#2c3e50";
        let extraOverlay = "";
        let glitchEffect = false;

        if (isBot) {
            // High Difficulty Bot Variants
            switch(variant % 5) {
                case 0: // Micro Antena & Subtle red glow in one eye
                    eyeRightColor = "#ff0055";
                    extraOverlay = `<rect x="108" y="38" width="4" height="12" fill="#ff0055"/>
                                    <circle cx="110" cy="36" r="3" fill="#ff0055"/>`;
                    break;
                case 1: // Micro Cyber Chip on cheek
                    extraOverlay = `<rect x="125" y="115" width="10" height="10" fill="#333" stroke="#00f2fe" stroke-width="1"/>
                                    <line x1="130" y1="125" x2="130" y2="135" stroke="#00f2fe" stroke-width="1"/>`;
                    break;
                case 2: // Digital Glitch Line through eyes
                    glitchEffect = true;
                    extraOverlay = `<rect x="50" y="85" width="100" height="3" fill="rgba(255,0,85,0.7)"/>`;
                    break;
                case 3: // Metallic Barcode on Neck
                    extraOverlay = `<rect x="85" y="152" width="30" height="8" fill="#fff"/>
                                    <line x1="88" y1="152" x2="88" y2="160" stroke="#000" stroke-width="2"/>
                                    <line x1="93" y1="152" x2="93" y2="160" stroke="#000" stroke-width="1"/>
                                    <line x1="98" y1="152" x2="98" y2="160" stroke="#000" stroke-width="3"/>`;
                    break;
                case 4: // Robotic iris (double ring in left eye)
                    extraOverlay = `<circle cx="75" cy="95" r="9" fill="none" stroke="#ff0055" stroke-width="1.5"/>`;
                    break;
            }
        } else {
            // Human variants (Fake variations that are STICK HUMAN)
            if (variant === 1) hairColor = "#1a1a1a"; // Slightly darker hair
            if (variant === 2) skinTone = "#f1c27d";  // Slightly tanned skin
        }

        return `
        <svg width="180" height="180" viewBox="0 0 200 200">
            <!-- Background Halo -->
            <circle cx="100" cy="100" r="90" fill="rgba(255,255,255,0.03)"/>
            
            <!-- Neck -->
            <rect x="85" y="140" width="30" height="30" fill="${skinTone}"/>
            
            <!-- Face -->
            <circle cx="100" cy="100" r="55" fill="${skinTone}"/>
            
            <!-- Hair -->
            <path d="M 45 90 Q 100 20 155 90 Q 100 45 45 90 Z" fill="${hairColor}"/>
            
            <!-- Eyes -->
            <circle cx="75" cy="95" r="6" fill="${eyeLeftColor}"/>
            <circle cx="125" cy="95" r="6" fill="${eyeRightColor}"/>
            <circle cx="77" cy="93" r="2" fill="#fff"/>
            <circle cx="127" cy="93" r="2" fill="#fff"/>
            
            <!-- Eyebrows -->
            <path d="M 65 82 Q 75 78 85 82" stroke="${hairColor}" stroke-width="3" fill="none"/>
            <path d="M 115 82 Q 125 78 135 82" stroke="${hairColor}" stroke-width="3" fill="none"/>
            
            <!-- Smile -->
            <path d="M 80 120 Q 100 135 120 120" stroke="#b05c5c" stroke-width="3" fill="none" stroke-linecap="round"/>

            <!-- Bot/Human Overlay Elements -->
            ${extraOverlay}
        </svg>
        `;
    }

    // --- GAME STATE ---
    let currentRound = 1;
    let score = 0;
    let roundTimer = null;
    let timeLeft = 3.0; // 3초 제한시간
    let currentIsHuman = true;
    const TOTAL_ROUNDS = 7;

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // 1. MEMORIZE GUIDE STEP
    function startGuide() {
        showScreen('screen-memo');
        document.getElementById('base-human-box').innerHTML = generateCharacterSVG(false, 0);
        
        let count = 3;
        document.getElementById('memo-timer').innerText = count;
        
        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                document.getElementById('memo-timer').innerText = count;
            } else {
                clearInterval(timer);
                startGame();
            }
        }, 1000);
    }

    // 2. START GAME
    function startGame() {
        currentRound = 1;
        score = 0;
        showScreen('screen-game');
        nextRound();
    }

    // 3. NEXT ROUND
    function nextRound() {
        if (currentRound > TOTAL_ROUNDS) {
            endGame();
            return;
        }

        document.getElementById('round-num').innerText = currentRound;
        document.getElementById('score-num').innerText = score;

        // Randomly choose Human or Bot (50% chance)
        currentIsHuman = Math.random() >= 0.5;
        const variant = Math.floor(Math.random() * 5);
        
        document.getElementById('character-target').innerHTML = generateCharacterSVG(!currentIsHuman, variant);

        // Reset Timer (3 seconds)
        timeLeft = 3.0;
        const timeFill = document.getElementById('time-fill');
        timeFill.style.width = '100%';

        clearInterval(roundTimer);
        const startTime = Date.now();

        roundTimer = setInterval(() => {
            const elapsedTime = (Date.now() - startTime) / 1000;
            timeLeft = Math.max(0, 3.0 - elapsedTime);
            
            timeFill.style.width = (timeLeft / 3.0 * 100) + '%';

            if (timeLeft <= 0) {
                clearInterval(roundTimer);
                makeChoice(null); // Timeout (Wrong)
            }
        }, 50);
    }

    // 4. USER CHOICE SELECTION
    function makeChoice(userThinksHuman) {
        clearInterval(roundTimer);

        const feedbackEl = document.getElementById('feedback');
        const isCorrect = (userThinksHuman === currentIsHuman);

        if (isCorrect) {
            // Speed Bonus: Maximum +1000 points based on speed
            const speedBonus = Math.floor(timeLeft * 250);
            const roundScore = 500 + speedBonus;
            score += roundScore;
            
            feedbackEl.innerText = "O";
            feedbackEl.className = "feedback correct";
            playSound('correct');
        } else {
            score = Math.max(0, score - 300); // Penalty
            feedbackEl.innerText = "X";
            feedbackEl.className = "feedback wrong";
            playSound('wrong');
        }

        setTimeout(() => {
            feedbackEl.className = "feedback";
            currentRound++;
            nextRound();
        }, 500);
    }

    // 5. END GAME & RESULTS
    function endGame() {
        showScreen('screen-result');
        document.getElementById('final-score').innerText = score;

        const badgeEl = document.getElementById('result-badge');
        const descEl = document.getElementById('result-desc');

        if (score >= 3500) {
            badgeEl.innerText = "👁️ VERIFIED HUMAN (상위 1%)";
            badgeEl.className = "badge human";
            descEl.innerText = "완벽합니다! 당신은 AI와 스파이 봇의 미세한 왜곡을 모두 꿰뚫어본 완벽한 인간입니다.";
        } else if (score >= 2000) {
            badgeEl.innerText = "⚠️ SUSPICIOUS HUMAN (일반)";
            badgeEl.className = "badge human";
            descEl.innerText = "대부분 구별해냈지만, 몇몇 정교한 봇의 위장에 속았습니다!";
        } else {
            badgeEl.innerText = "🤖 DETECTED AS BOT (실패)";
            badgeEl.className = "badge bot";
            descEl.innerText = "구별에 실패했습니다. 당신은 봇으로 분류되었습니다!";
        }
    }

    // 6. X (TWITTER) SHARE
    function shareTwitter() {
        const text = `[WLD Human Check Challenge] 👁️🤖\n내 월드 ID 검증 점수: ${score}점!\n당신은 3초 만에 봇을 가려낼 수 있나요?`;
        const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&hashtags=Worldcoin,WLD,WorldID`;
        window.open(url, '_blank');
    }
</script>
</body>
</html>
